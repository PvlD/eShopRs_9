[package]
name = "app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }

http.workspace = true
cfg-if.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
reqwest = { workspace = true, optional = true }
settings = { path = "../settings", optional = true }
log.workspace = true
tower-sessions = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true }
url = { version = "2" }
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
web-sys = { version = "0.3", optional = true, features = ["EventSource", "MessageEvent"] }
wasm-bindgen = { workspace = true, optional = true }
garde = { version = "0.22", features = ["derive"] }
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "rustls"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14"

[features]
default = []
hydrate = ["leptos/hydrate", "dep:web-sys", "dep:wasm-bindgen"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:leptos_axum", "dep:reqwest", "dep:settings", "dep:tower-sessions", "dep:uuid", "dep:base64", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:chrono", "dep:async-openai"]

