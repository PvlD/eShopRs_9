[package]
name = "eventbus"
version = "0.1.0"
edition = "2021"

[dependencies]
amqprs = { version = "2", features = ["traces"] }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tracing = "0.1"
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
futures = "0.3"
